<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portfolio — Julia Stiles</title>
    <meta name="description" content="All projects by Julia Stiles, designer and developer: illustration, UI/UX and graphic design." />
    <meta name="theme-color" content="#ffffff" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

    <!-- Link previews (Telegram, LinkedIn, Slack, X). scripts/prerender.mjs makes og:image absolute
         and adds canonical / og:url when the build runs with SITE_URL set. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Julia." />
    <meta property="og:title" content="Portfolio — Julia Stiles" />
    <meta property="og:description" content="All projects by Julia Stiles, designer and developer: illustration, UI/UX and graphic design." />
    <meta property="og:image" content="/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Julia Stiles on a yellow diamond" />
    <meta name="twitter:card" content="summary_large_image" />


    <!-- Self-hosted Roboto (src/styles/fonts.css): start downloading it with the HTML. -->
    <link rel="preload" href="/fonts/roboto-latin-var.woff2" as="font" type="font/woff2" crossorigin />

    <!-- Reveal animations hide content only under html.js. Set it before the first paint so the
         prerendered page does not flash its content before the animations start. -->
    <script>document.documentElement.classList.add('js');</script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/portfolio.tsx"></script>
  </body>
</html>
